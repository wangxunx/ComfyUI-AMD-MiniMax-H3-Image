[project]
name = "amd-minimax-h3-image"
description = "MiniMax H3 Image text-to-image and multi-image editing through the AMD gateway. Register for an API key; no local GPU required."
version = "1.1.2"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/wangxunx/ComfyUI-AMD-MiniMax-H3-Image"
Documentation = "https://github.com/wangxunx/ComfyUI-AMD-MiniMax-H3-Image#readme"
"Bug Tracker" = "https://github.com/wangxunx/ComfyUI-AMD-MiniMax-H3-Image/issues"

[tool.comfy]
PublisherId = "wangxunx"
DisplayName = "ComfyUI-AMD-MiniMax-H3-Image"
Icon = "https://raw.githubusercontent.com/wangxunx/ComfyUI-AMD-MiniMax-H3-Image/main/assets/icon.png"
Banner = "https://raw.githubusercontent.com/wangxunx/ComfyUI-AMD-MiniMax-H3-Image/main/assets/banner.jpg"
# nodes.py reuses the MiniMax H3 @ImageN prompt tag resolver, which only exists from this release on.
requires-comfyui = ">=0.44.0"
